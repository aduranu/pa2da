[project]
name = "panda-data-agent"
version = "0.1.0"
description = "Slack-native agent for extracting supplementary data from scientific papers"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.21,<2",
    "langgraph>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-anthropic>=0.3,<1",
    "firecrawl-py>=1.5,<2",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.22,<1",
    "ruff>=0.8,<1",
]

[project.scripts]
panda = "panda.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["src/panda"]

[tool.uv.workspace]
members = [
    "pm_interview",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
